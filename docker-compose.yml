services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: ${VANGUARD_POSTGRES_PASSWORD:?Set a PostgreSQL password}
      POSTGRES_DB: vanguard_soc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard -d vanguard_soc"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${VANGUARD_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${VANGUARD_DATABASE_URL:?Set the PostgreSQL URL for host db}
      SECRET_KEY: ${VANGUARD_SECRET_KEY:?Set a signing key}
      ALLOWED_ORIGINS: ${VANGUARD_ALLOWED_ORIGINS:-http://localhost:3000}
      APPROVED_NETWORK_TARGETS: ${APPROVED_NETWORK_TARGETS:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
